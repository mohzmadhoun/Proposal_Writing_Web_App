[project]
name = "proposal-writing-backend"
version = "0.1.0"
description = "FastAPI backend for the Proposal Writing Web App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "fastapi",
  "pyjwt",
  "passlib",
  "pydantic-settings",
  "pydantic[email]",
  "python-dotenv",
  "pyyaml",
  "sqlalchemy",
  "psycopg[binary]",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests that require external services like PostgreSQL",
]
