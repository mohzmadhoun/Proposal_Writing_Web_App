services:
  db:
    image: pgvector/pgvector:pg16
    container_name: proposal-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: proposal_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proposal_app"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
